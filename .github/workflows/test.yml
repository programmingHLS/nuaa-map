name: 自动化测试

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 代码规范检查（oxlint）
        run: npm run lint

      - name: 运行单元测试（Vitest）
        run: npm test

      - name: 生产构建
        run: npm run build
